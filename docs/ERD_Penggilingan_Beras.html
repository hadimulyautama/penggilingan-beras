<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>ERD — Sistem Manajemen Penggilingan Beras</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f172a; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
#toolbar {
  position: fixed; top: 0; left: 0; right: 0; height: 48px;
  background: #1e293b; border-bottom: 1px solid #334155;
  display: flex; align-items: center; padding: 0 16px; gap: 12px; z-index: 100;
}
#toolbar h1 { color: #e2e8f0; font-size: 14px; font-weight: 700; white-space: nowrap; }
.btn {
  background: #334155; color: #e2e8f0; border: 1px solid #475569;
  padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
}
.btn:hover { background: #475569; }
#search {
  background: #0f172a; color: #e2e8f0; border: 1px solid #334155;
  padding: 5px 10px; border-radius: 6px; font-size: 12px; width: 180px;
}
#zoom-info { color: #94a3b8; font-size: 12px; min-width: 60px; }
.legend {
  display: flex; gap: 10px; margin-left: auto; flex-wrap: wrap;
}
.legend-item {
  display: flex; align-items: center; gap: 5px;
  color: #94a3b8; font-size: 11px; white-space: nowrap;
}
.legend-dot { width: 12px; height: 12px; border-radius: 3px; }
#canvas-wrap {
  position: fixed; top: 48px; left: 0; right: 0; bottom: 0;
  overflow: hidden; cursor: grab;
}
#canvas-wrap.grabbing { cursor: grabbing; }
#erd-svg { position: absolute; top: 0; left: 0; }

/* Table styles */
.tbl-header { font-size: 11px; font-weight: 700; }
.tbl-field { font-size: 10px; }
.tbl-pk { font-weight: 700; }
.tbl-fk { font-style: italic; }
.tbl-box { transition: filter 0.2s; cursor: pointer; }
.tbl-box:hover { filter: brightness(1.15); }
.tbl-box.highlighted { filter: brightness(1.3) drop-shadow(0 0 8px rgba(255,255,255,0.4)); }
.tbl-box.dimmed { filter: brightness(0.4); }
.rel-line { stroke-width: 1.5; fill: none; opacity: 0.5; }
.rel-line.highlighted { opacity: 1; stroke-width: 2.5; }
.rel-line.dimmed { opacity: 0.1; }
#tooltip {
  position: fixed; background: #1e293b; border: 1px solid #334155;
  border-radius: 8px; padding: 10px 14px; color: #e2e8f0; font-size: 11px;
  pointer-events: none; display: none; z-index: 200; max-width: 260px; line-height: 1.6;
}
</style>
</head>
<body>
<div id="toolbar">
  <h1>🌾 ERD — Sistem Penggilingan Beras</h1>
  <button class="btn" onclick="resetView()">⟳ Reset</button>
  <button class="btn" onclick="zoomIn()">+</button>
  <button class="btn" onclick="zoomOut()">−</button>
  <span id="zoom-info">100%</span>
  <input type="text" id="search" placeholder="Cari tabel..." oninput="searchTable(this.value)">
  <button class="btn" onclick="clearHighlight()">✕ Clear</button>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#1e40af"></div>Master Data</div>
    <div class="legend-item"><div class="legend-dot" style="background:#0e4f8a"></div>Gudang 1</div>
    <div class="legend-item"><div class="legend-dot" style="background:#7c3aed"></div>Transfer</div>
    <div class="legend-item"><div class="legend-dot" style="background:#92400e"></div>G2 Bahan</div>
    <div class="legend-item"><div class="legend-dot" style="background:#6b21a8"></div>G2 Produksi</div>
    <div class="legend-item"><div class="legend-dot" style="background:#065f46"></div>Byproduct</div>
    <div class="legend-item"><div class="legend-dot" style="background:#166534"></div>Stok & Keluar</div>
    <div class="legend-item"><div class="legend-dot" style="background:#374151"></div>Sistem</div>
  </div>
</div>
<div id="canvas-wrap">
  <svg id="erd-svg" width="6000" height="5200"></svg>
</div>
<div id="tooltip"></div>

// Build lookup
const tableMap = {};
TABLES.forEach(t => tableMap[t.id] = t);

// ─── RENDER ───
const svg = document.getElementById('erd-svg');
const svgNS = 'http://www.w3.org/2000/svg';

function el(tag, attrs={}) {
  const e = document.createElementNS(svgNS, tag);
  for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  return e;
}
function txt(content, attrs={}) {
  const t = el('text', attrs);
  t.textContent = content;
  return t;
}
function rect(attrs) { return el('rect', attrs); }

// Draw group backgrounds
const GROUP_BOUNDS = {};
function computeBounds() {
  TABLES.forEach(t => {
    const g = t.group;
    const h = tableHeight(t.fields);
    if(!GROUP_BOUNDS[g]) GROUP_BOUNDS[g] = {x1:9999,y1:9999,x2:0,y2:0};
    const b = GROUP_BOUNDS[g];
    b.x1 = Math.min(b.x1, t.x - 15);
    b.y1 = Math.min(b.y1, t.y - 35);
    b.x2 = Math.max(b.x2, t.x + TW + 15);
    b.y2 = Math.max(b.y2, t.y + h + 15);
  });
}
computeBounds();

// Group bg layer
const bgLayer = el('g', {id:'bg-layer'});
svg.appendChild(bgLayer);
Object.entries(GROUP_BOUNDS).forEach(([g, b]) => {
  const grp = GROUPS[g];
  const r = rect({x:b.x1, y:b.y1, width:b.x2-b.x1, height:b.y2-b.y1,
    rx:'12', fill:grp.color+'22', stroke:grp.color+'66', 'stroke-width':'1.5'});
  bgLayer.appendChild(r);
  const lbl = txt(grp.label, {x:b.x1+12, y:b.y1+18,
    fill:grp.text, 'font-size':'12', 'font-weight':'700', opacity:'0.7'});
  bgLayer.appendChild(lbl);
});

// Relationship lines layer
const relLayer = el('g', {id:'rel-layer'});
svg.appendChild(relLayer);

function getTableCenter(id) {
  const t = tableMap[id];
  if(!t) return null;
  return { x: t.x + TW/2, y: t.y + tableHeight(t.fields)/2 };
}
function getTableEdge(fromId, toId) {
  const from = tableMap[fromId];
  const to = tableMap[toId];
  if(!from || !to) return null;
  const fx = from.x + TW/2, fy = from.y + tableHeight(from.fields)/2;
  const tx = to.x + TW/2, ty = to.y + tableHeight(to.fields)/2;
  // Calculate edge point
  let sx, sy, ex, ey;
  if(fx < tx) { sx = from.x + TW; ex = to.x; }
  else { sx = from.x; ex = to.x + TW; }
  sy = fy; ey = ty;
  return {sx, sy, ex, ey, fx, fy, tx, ty};
}

const relLines = {};
RELS.forEach(([from, to, field], i) => {
  const pts = getTableEdge(from, to);
  if(!pts) return;
  const {sx, sy, ex, ey} = pts;
  const cp1x = sx + (ex-sx)*0.4;
  const cp2x = sx + (ex-sx)*0.6;
  const g = GROUPS[tableMap[from]?.group] || GROUPS.master;
  const path = el('path', {
    d:`M${sx},${sy} C${cp1x},${sy} ${cp2x},${ey} ${ex},${ey}`,
    stroke: g.color, class:'rel-line',
    'data-from':from, 'data-to':to, 'data-field':field
  });
  relLayer.appendChild(path);
  if(!relLines[from]) relLines[from] = [];
  if(!relLines[to]) relLines[to] = [];
  relLines[from].push(path);
  relLines[to].push(path);
});

// Tables layer
const tblLayer = el('g', {id:'tbl-layer'});
svg.appendChild(tblLayer);

const tableEls = {};
TABLES.forEach(t => {
  const grp = GROUPS[t.group];
  const h = tableHeight(t.fields);
  const g = el('g', {class:'tbl-box', 'data-id':t.id, transform:`translate(${t.x},${t.y})`});

  // Shadow
  const shadow = rect({x:2, y:2, width:TW, height:h, rx:'8', fill:'#000', opacity:'0.3'});
  g.appendChild(shadow);

  // Body
  const body = rect({x:0, y:0, width:TW, height:h, rx:'8', fill:'#1e293b', stroke:grp.color, 'stroke-width':'1.5'});
  g.appendChild(body);

  // Header
  const hdr = rect({x:0, y:0, width:TW, height:TH, rx:'8', fill:grp.color});
  const hdr2 = rect({x:0, y:TH/2, width:TW, height:TH/2, fill:grp.color}); // square bottom corners
  g.appendChild(hdr);
  g.appendChild(hdr2);

  const hdrTxt = txt(t.id, {x:TW/2, y:TH/2+4, 'text-anchor':'middle',
    fill:'#fff', 'font-size':'10', 'font-weight':'700', class:'tbl-header'});
  g.appendChild(hdrTxt);

  // Fields
  t.fields.forEach((f, i) => {
    const fy = TH + i*FH + 14;
    let prefix = '';
    let color = '#cbd5e1';
    let weight = 'normal';
    let style = 'normal';
    if(f.t === 'PK') { prefix = '🔑 '; color = '#fbbf24'; weight = 'bold'; }
    else if(f.t === 'FK' || f.t === 'FK (nullable)') { prefix = '→ '; color = '#93c5fd'; style = 'italic'; }
    const ftxt = txt(prefix + f.n, {x:8, y:fy,
      fill:color, 'font-size':'9', 'font-weight':weight,
      'font-style':style, class:'tbl-field'});
    // Truncate long field names
    ftxt.setAttribute('textLength', TW-16);
    ftxt.setAttribute('lengthAdjust', 'spacingAndGlyphs');
    g.appendChild(ftxt);
  });

  // Border line
  const bline = el('line', {x1:8, y1:TH, x2:TW-8, y2:TH, stroke:grp.color, 'stroke-width':'0.5', opacity:'0.5'});
  g.appendChild(bline);

  // Events
  g.addEventListener('click', () => highlightTable(t.id));
  g.addEventListener('mouseenter', (e) => showTooltip(e, t));
  g.addEventListener('mouseleave', hideTooltip);

  tblLayer.appendChild(g);
  tableEls[t.id] = g;
});

// Views layer
const viewLayer = el('g', {id:'view-layer'});
svg.appendChild(viewLayer);
VIEWS.forEach(v => {
  const vg = el('g', {transform:`translate(${v.x},${v.y})`});
  const vr = rect({x:0, y:0, width:300, height:24, rx:'4',
    fill:v.color+'33', stroke:v.color, 'stroke-width':'1', 'stroke-dasharray':'4,2'});
  vg.appendChild(vr);
  const vt = txt('⊞ '+v.label, {x:8, y:16, fill:'#5eead4', 'font-size':'9', 'font-weight':'600'});
  vg.appendChild(vt);
  vg.addEventListener('mouseenter', (e) => {
    document.getElementById('tooltip').style.display = 'block';
    document.getElementById('tooltip').innerHTML = `<strong>${v.label}</strong><br>${v.desc}`;
  });
  vg.addEventListener('mouseleave', hideTooltip);
  vg.addEventListener('mousemove', moveTooltip);
  viewLayer.appendChild(vg);
});

// ─── INTERACTIONS ───
let highlighted = null;
function highlightTable(id) {
  if(highlighted === id) { clearHighlight(); return; }
  highlighted = id;
  // Dim all
  Object.values(tableEls).forEach(e => { e.classList.remove('highlighted','dimmed'); e.classList.add('dimmed'); });
  document.querySelectorAll('.rel-line').forEach(l => { l.classList.remove('highlighted','dimmed'); l.classList.add('dimmed'); });
  // Highlight selected + related
  tableEls[id]?.classList.remove('dimmed');
  tableEls[id]?.classList.add('highlighted');
  const connected = new Set([id]);
  (relLines[id] || []).forEach(line => {
    line.classList.remove('dimmed');
    line.classList.add('highlighted');
    const f = line.getAttribute('data-from');
    const t = line.getAttribute('data-to');
    connected.add(f); connected.add(t);
  });
  connected.forEach(tid => {
    tableEls[tid]?.classList.remove('dimmed');
  });
}
function clearHighlight() {
  highlighted = null;
  Object.values(tableEls).forEach(e => { e.classList.remove('highlighted','dimmed'); });
  document.querySelectorAll('.rel-line').forEach(l => { l.classList.remove('highlighted','dimmed'); });
}
function searchTable(q) {
  if(!q) { clearHighlight(); return; }
  const q2 = q.toLowerCase();
  Object.entries(tableEls).forEach(([id, el]) => {
    if(id.toLowerCase().includes(q2)) {
      el.classList.remove('dimmed'); el.classList.add('highlighted');
    } else {
      el.classList.add('dimmed'); el.classList.remove('highlighted');
    }
  });
}

// Tooltip
const tooltip = document.getElementById('tooltip');
function showTooltip(e, t) {
  const fields = t.fields.map(f => `${f.t==='PK'?'🔑':f.t.startsWith('FK')?'→':' '} ${f.n}`).join('<br>');
  tooltip.innerHTML = `<strong>${t.id}</strong><br><em style="color:#94a3b8;font-size:10px">${t.desc||''}</em><hr style="border-color:#334155;margin:4px 0"><div style="font-size:10px;color:#94a3b8">${fields}</div>`;
  tooltip.style.display = 'block';
  moveTooltip(e);
}
function hideTooltip() { tooltip.style.display = 'none'; }
function moveTooltip(e) {
  tooltip.style.left = (e.clientX + 15) + 'px';
  tooltip.style.top = (e.clientY + 10) + 'px';
}
document.querySelectorAll('.tbl-box').forEach(el => {
  el.addEventListener('mousemove', moveTooltip);
});

// ─── PAN & ZOOM ───
let scale = 0.28, tx = 20, ty = 20, dragging = false, lastX, lastY;
const wrap = document.getElementById('canvas-wrap');

function applyTransform() {
  svg.style.transform = `scale(${scale}) translate(${tx}px,${ty}px)`;
  svg.style.transformOrigin = '0 0';
  document.getElementById('zoom-info').textContent = Math.round(scale*100)+'%';
}
applyTransform();

wrap.addEventListener('mousedown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  wrap.classList.add('grabbing');
});
window.addEventListener('mouseup', () => { dragging = false; wrap.classList.remove('grabbing'); });
window.addEventListener('mousemove', e => {
  if(!dragging) return;
  tx += (e.clientX - lastX)/scale;
  ty += (e.clientY - lastY)/scale;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const rect = wrap.getBoundingClientRect();
  const mx = (e.clientX - rect.left)/scale - tx;
  const my = (e.clientY - rect.top)/scale - ty;
  scale *= delta;
  scale = Math.max(0.1, Math.min(3, scale));
  tx = (e.clientX - rect.left)/scale - mx;
  ty = (e.clientY - rect.top)/scale - my;
  applyTransform();
}, {passive:false});

function zoomIn() { scale = Math.min(3, scale*1.2); applyTransform(); }
function zoomOut() { scale = Math.max(0.1, scale/1.2); applyTransform(); }
function resetView() { scale=0.28; tx=20; ty=20; applyTransform(); clearHighlight(); }

// Grid background
const defs = el('defs');
const pattern = el('pattern', {id:'grid', width:'50', height:'50', patternUnits:'userSpaceOnUse'});
const path1 = el('path', {d:'M 50 0 L 0 0 0 50', fill:'none', stroke:'#1e293b', 'stroke-width':'0.5'});
pattern.appendChild(path1);
defs.appendChild(pattern);
svg.insertBefore(defs, svg.firstChild);
const gridrect = rect({width:'100%', height:'100%', fill:'url(#grid)'});
svg.insertBefore(gridrect, svg.firstChild);
</script>
