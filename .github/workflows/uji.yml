# Uji penuh + uji Postgres, hanya atas perintah manual pengguna.
#
# Temuan QA UJI-02, 11 September 2026. Bug khusus Postgres dan balapan harus
# tertangkap di sini, bukan di pos timbang: SQLite mengubah NaN jadi NULL, tak
# menegakkan panjang VARCHAR, mematikan foreign key, dan memakai satu koneksi —
# jadi lima temuan (T-03, T-04, T-08, T-09, T-12) lolos di suite lalu gagal di
# server.
#
# Alur ini TIDAK menyentuh Railway: tak ada rahasia yang dipakai, tak ada
# deploy. Ia hanya menjalankan uji di database sementara milik runner-nya
# sendiri.
name: uji

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      cakupan:
        description: Cakupan pemeriksaan manual
        type: choice
        required: true
        default: semua
        options:
          - semua
          - koreksi-bahan

jobs:
  uji:
    if: ${{ github.event.inputs.cakupan != 'koreksi-bahan' }}
    name: Uji ${{ matrix.profil }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profil: [satuan, postgresql-0, postgresql-1, postgresql-2, postgresql-3, postgresql-4, postgresql-5, postgresql-6, postgresql-7]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: uji
          POSTGRES_DB: uji_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Pagar yang sama dengan di laptop: loopback, dan nama berawalan "uji_".
      # Uji Postgres MENOLAK jalan bila salah satunya tak terpenuhi — lihat
      # tests/pg/conftest.py.
      UJI_PG_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:5432/uji_ci
      DATABASE_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:5432/uji_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pasang Chromium untuk pengujian antarmuka
        run: python -m playwright install --with-deps chromium

      - name: Migrasi dari database KOSONG
        run: alembic upgrade head

      # `alembic check` adalah PENJAGA, bukan laporan.
      #
      # Selisih model ↔ migrasi sudah dirapikan (migrasi 0043 & 0044, temuan
      # QA X-19): 33 kolom yang dijanjikan model NOT NULL kini benar-benar
      # NOT NULL di basis data, 21 indeks dideklarasikan apa adanya di model,
      # dan dua kolom `deleted_at` akhirnya bertipe sama.
      #
      # Sejak itu `check` bersih, jadi ia bisa menahan. Selisih BARU berarti
      # seseorang mengubah model tanpa menulis migrasinya — dan itu ketahuan
      # di sini, bukan saat deploy.
      - name: Periksa selisih model ↔ migrasi
        run: alembic check

      - name: Uji satu aplikasi tanpa mengurangi cakupan
        env:
          PROFIL_CI: ${{ matrix.profil }}
          UJI_BROWSER_PILIHAN_SILO: "1"
        run: |
          python - <<'PYTHON'
          import os,subprocess,sys
          from pathlib import Path
          profil=os.environ['PROFIL_CI']
          if profil=='satuan':
              paths=['tests','--ignore=tests/pg']
          else:
              # Delapan daftar berkas saling lepas; gabungannya seluruh tests/pg.
              files=sorted(set(Path('tests/pg').rglob('test_*.py')) | set(Path('tests/pg').rglob('*_test.py')))
              paths=[str(p) for p in files[int(profil[-1])::8]]
          Path('bukti').mkdir(exist_ok=True)
          Path('bukti/berkas-'+profil+'.txt').write_text('\n'.join(paths)+'\n')
          raise SystemExit(subprocess.call([sys.executable,'-m','pytest',*paths,'-vv','-o','faulthandler_timeout=120','-m','not dua_aplikasi','--junitxml=bukti/satu-aplikasi.xml']))
          PYTHON

      - name: Simpan hasil satu aplikasi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-${{ matrix.profil }}
          path: bukti/

  dua-aplikasi:
    if: ${{ github.event.inputs.cakupan != 'koreksi-bahan' }}
    name: Integrasi HTTP PadiFlow dan TeraFlow terpin
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: uji
          POSTGRES_DB: uji_tf_kiriman_ci
        ports: ["56627:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      UJI_PG_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:56627/uji_tf_kiriman_ci
      DATABASE_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:56627/uji_tf_kiriman_ci
      UJI_TF_ROOT: ${{ github.workspace }}/timbangan
      UJI_TF_PYTHON: ${{ github.workspace }}/timbangan/.venv/bin/python
      UJI_KIRIMAN_OUT: ${{ github.workspace }}/bukti/dua-aplikasi
    steps:
      - uses: actions/checkout@v4
        with:
          path: padiflow
      # Pin kode rilis master dinamis; SHA diperiksa sebelum migrasi.
      - uses: actions/checkout@v4
        with:
          repository: hadimulyautama/timbangan
          ref: 3f96b471212d9c14e9b842a59cfbd679d566e92e
          path: timbangan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            padiflow/requirements*.txt
            timbangan/requirements.txt
      - name: Periksa revisi TeraFlow terpin
        run: test "$(git -C timbangan rev-parse HEAD)" = "3f96b471212d9c14e9b842a59cfbd679d566e92e"
      - name: Pasang dua interpreter terpisah
        run: |
          python -m pip install -r padiflow/requirements.txt -r padiflow/requirements-dev.txt -r padiflow/tests/pg/requirements-dua-aplikasi.txt
          python -m venv timbangan/.venv
          timbangan/.venv/bin/pip install -r timbangan/requirements.txt
      - name: Pasang Chromium untuk PWA dan luring
        run: python -m playwright install --with-deps chromium
      - name: Migrasi nyata, integrasi HTTP dan navigasi muat browser
        working-directory: padiflow
        run: >-
          python -m pytest -q -m dua_aplikasi
          tests/pg/test_teraflow_kiriman.py tests/pg/test_master_dua_app.py tests/pg/test_integrasi_verifikasi473.py
          tests/pg/test_muat_navigasi_browser.py tests/pg/test_pengiriman_pk_dua_aplikasi.py
          --junitxml=../bukti/dua-aplikasi/junit.xml
      - name: Simpan hasil dua aplikasi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-dua-aplikasi
          path: bukti/dua-aplikasi/junit.xml

  retur-dua-aplikasi:
    if: ${{ github.event.inputs.cakupan != 'koreksi-bahan' }}
    name: Integrasi HTTP retur PadiFlow dan TeraFlow terpin
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: uji
          POSTGRES_DB: uji_tf_retur_ci
        ports: ["56639:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      UJI_PG_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:56639/uji_tf_retur_ci
      DATABASE_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:56639/uji_tf_retur_ci
      UJI_TF_ROOT: ${{ github.workspace }}/timbangan
      UJI_TF_PYTHON: ${{ github.workspace }}/timbangan/.venv/bin/python
      UJI_RETUR_OUT: ${{ github.workspace }}/bukti/retur-dua-aplikasi
    steps:
      - uses: actions/checkout@v4
        with:
          path: padiflow
      # Retur dan pengiriman memakai revisi TeraFlow yang sama.
      - uses: actions/checkout@v4
        with:
          repository: hadimulyautama/timbangan
          ref: 3f96b471212d9c14e9b842a59cfbd679d566e92e
          path: timbangan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            padiflow/requirements*.txt
            timbangan/requirements.txt
      - name: Periksa revisi TeraFlow terpin
        run: test "$(git -C timbangan rev-parse HEAD)" = "3f96b471212d9c14e9b842a59cfbd679d566e92e"
      - name: Pasang dua interpreter terpisah untuk retur
        run: |
          python -m pip install -r padiflow/requirements.txt -r padiflow/requirements-dev.txt
          python -m venv timbangan/.venv
          timbangan/.venv/bin/pip install -r timbangan/requirements.txt
      - name: Migrasi nyata dan integrasi HTTP retur
        working-directory: padiflow
        run: >-
          python -m pytest -q -m dua_aplikasi tests/pg/test_retur_dua_app.py
          --junitxml=../bukti/retur-dua-aplikasi/junit.xml
      - name: Simpan bukti integrasi retur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-retur-dua-aplikasi
          path: bukti/retur-dua-aplikasi/

  # Profil fokus tidak mengganti cakupan penuh; default tetap semua.
  koreksi-bahan:
    if: ${{ github.event.inputs.cakupan == 'koreksi-bahan' }}
    name: Koreksi atomik, stok, akses, dan regresi portal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: uji
          POSTGRES_DB: uji_koreksi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:5432/uji_koreksi
      UJI_PG_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:5432/uji_koreksi
      MODE_UJI: "1"
      SECRET_KEY: kunci-uji-ci-koreksi-bukan-produksi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Pasang dependensi
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrasi dan keselarasan model
        run: |
          alembic upgrade head
          alembic check
      - name: Uji koreksi dan regresi terkait
        run: >-
          python -m pytest -q --junitxml=bukti/koreksi-aktif.xml
          tests/pg/test_koreksi_bahan_berjalan.py
          tests/pg/test_koreksi_bahan_curah.py
          tests/pg/test_cermin_bertanda.py
          tests/pg/test_giling_ringkas.py
          tests/pg/test_sosoh_ringkas.py
          tests/pg/test_beras_silo_berat_nyata.py
          tests/pg/test_curah_beras_ke_silo.py
          tests/pg/test_konsolidasi_stok.py
          tests/pg/test_portal_stok_karung.py
          tests/pg/test_portal_alur_hp.py
          tests/pg/test_stok_penerimaan.py
          tests/test_antrean.py::test_tiap_layar_berlaci_membawa_ketiga_lencana
      - name: Simpan bukti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: koreksi-bahan-hasil-aktif
          path: bukti/

  safari:
    name: Operator Safari/iPhone (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: uji
          POSTGRES_DB: uji_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      UJI_PG_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:5432/uji_ci
      DATABASE_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:5432/uji_ci
      UJI_BROWSER: ${{ matrix.browser }}
      UJI_IPHONE: "1"
      UJI_BROWSER_PILIHAN_SILO: "1"
      UJI_BROWSER_DRYER_GUDANG: "1"
      UJI_BROWSER_GILING_DESAIN: "1"
      UJI_BROWSER_SOSOH_DESAIN: "1"
      UJI_BROWSER_PEMBARUAN: "1"
      BUKTI_GILING_DESAIN: bukti/giling
      BUKTI_SOSOH_DESAIN: bukti/sosoh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Pasang dependensi dan mesin browser yang diminta
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps "${{ matrix.browser }}"
      - name: Migrasi database sementara dari kosong
        run: alembic upgrade head
      - name: Gudang kerja, dryer, silo, giling, sosoh, stok dan portal di iPhone
        run: |
          python -m pytest -q tests/test_kepemilikan_tampilan.py \
            tests/test_portal_angka_browser.py \
            tests/pg/test_dryer_gudang_kerja_browser.py \
            tests/pg/test_pilihan_silo_giling_browser.py \
            tests/pg/test_pilihan_sosoh_browser.py \
            tests/pg/test_status_alat.py \
            tests/pg/test_giling_desain_browser.py \
            tests/pg/test_sosoh_desain_browser.py \
            tests/pg/test_kiriman_samping_browser.py \
            tests/pg/test_muat_navigasi_browser.py \
            tests/pg/test_pembaruan_aset_browser.py \
            tests/pg/test_safari_portal.py \
            --junitxml=bukti/safari.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-padiflow-${{ matrix.browser }}
          path: bukti/
