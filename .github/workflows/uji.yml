# Uji penuh + uji Postgres, tiap push dan pull request.
#
# Temuan QA UJI-02, 11 September 2026. Bug khusus Postgres dan balapan harus
# tertangkap di sini, bukan di pos timbang: SQLite mengubah NaN jadi NULL, tak
# menegakkan panjang VARCHAR, mematikan foreign key, dan memakai satu koneksi —
# jadi lima temuan (T-03, T-04, T-08, T-09, T-12) lolos di suite lalu gagal di
# server.
#
# Alur ini TIDAK menyentuh Railway: tak ada rahasia yang dipakai, tak ada
# deploy. Ia hanya menjalankan uji di database sementara milik runner-nya
# sendiri.
name: uji

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  uji:
    name: Uji ${{ matrix.profil }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profil: [satuan, postgresql-0, postgresql-1]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: uji
          POSTGRES_DB: uji_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Pagar yang sama dengan di laptop: loopback, dan nama berawalan "uji_".
      # Uji Postgres MENOLAK jalan bila salah satunya tak terpenuhi — lihat
      # tests/pg/conftest.py.
      UJI_PG_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:5432/uji_ci
      DATABASE_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:5432/uji_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Migrasi dari database KOSONG
        run: alembic upgrade head

      # `alembic check` adalah PENJAGA, bukan laporan.
      #
      # Selisih model ↔ migrasi sudah dirapikan (migrasi 0043 & 0044, temuan
      # QA X-19): 33 kolom yang dijanjikan model NOT NULL kini benar-benar
      # NOT NULL di basis data, 21 indeks dideklarasikan apa adanya di model,
      # dan dua kolom `deleted_at` akhirnya bertipe sama.
      #
      # Sejak itu `check` bersih, jadi ia bisa menahan. Selisih BARU berarti
      # seseorang mengubah model tanpa menulis migrasinya — dan itu ketahuan
      # di sini, bukan saat deploy.
      - name: Periksa selisih model ↔ migrasi
        run: alembic check

      - name: Uji satu aplikasi tanpa mengurangi cakupan
        env:
          PROFIL_CI: ${{ matrix.profil }}
        run: |
          python - <<'PYTHON'
          import os,subprocess,sys
          from pathlib import Path
          profil=os.environ['PROFIL_CI']
          if profil=='satuan':
              paths=['tests','--ignore=tests/pg']
          else:
              # Dua daftar berkas saling lepas; gabungannya seluruh tests/pg.
              files=sorted(set(Path('tests/pg').rglob('test_*.py')) | set(Path('tests/pg').rglob('*_test.py')))
              paths=[str(p) for p in files[int(profil[-1])::2]]
          Path('bukti').mkdir(exist_ok=True)
          Path('bukti/berkas-'+profil+'.txt').write_text('\n'.join(paths)+'\n')
          raise SystemExit(subprocess.call([sys.executable,'-m','pytest',*paths,'-q','-m','not dua_aplikasi','--junitxml=bukti/satu-aplikasi.xml']))
          PYTHON

      - name: Simpan hasil satu aplikasi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-${{ matrix.profil }}
          path: bukti/

  dua-aplikasi:
    name: Integrasi HTTP PadiFlow dan TeraFlow82 terpin
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: uji
          POSTGRES_DB: uji_tf_kiriman_ci
        ports: ["56627:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      UJI_PG_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:56627/uji_tf_kiriman_ci
      DATABASE_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:56627/uji_tf_kiriman_ci
      UJI_TF_ROOT: ${{ github.workspace }}/timbangan
      UJI_KIRIMAN_OUT: ${{ github.workspace }}/bukti/dua-aplikasi
    steps:
      - uses: actions/checkout@v4
        with:
          path: padiflow
      # Main TeraFlow belum mewakili paket yang diterbitkan. Snapshot ini
      # identik170hash rilis82 dan dipublikasikan dengan izin pemilik hanya
      # untuk CI. Pin SHA, jangan mengikuti cabang/main yang terus bergerak.
      - uses: actions/checkout@v4
        with:
          repository: hadimulyautama/timbangan
          ref: 0200668a8eab721f4d991ede6e0808d4d656c411
          path: timbangan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            padiflow/requirements*.txt
            timbangan/requirements.txt
      - name: Periksa source TeraFlow terpin
        run: |
          python - <<'PYTHON'
          import json,hashlib
          from pathlib import Path
          root=Path('timbangan')
          manifest=json.loads((root/'CI_SOURCE_MANIFEST.json').read_text())
          assert manifest['release']=='TeraFlow82'
          assert len(manifest['source_manifest'])==170
          for file,digest in manifest['source_manifest'].items():
              assert hashlib.sha256((root/file).read_bytes()).hexdigest()==digest,file
          print('170hash source sama dengan paket TeraFlow82 teruji.')
          PYTHON
      - name: Pasang dua interpreter terpisah
        run: |
          python -m pip install -r padiflow/requirements.txt -r padiflow/requirements-dev.txt -r padiflow/tests/pg/requirements-dua-aplikasi.txt
          python -m venv timbangan/.venv
          timbangan/.venv/bin/pip install -r timbangan/requirements.txt
      - name: Pasang Chromium untuk PWA dan luring
        run: python -m playwright install --with-deps chromium
      - name: Migrasi nyata dan sembilan integrasi HTTP
        working-directory: padiflow
        run: >-
          python -m pytest -q -m dua_aplikasi
          tests/pg/test_teraflow_kiriman.py tests/pg/test_integrasi_verifikasi473.py
          --junitxml=../bukti/dua-aplikasi/junit.xml
      - name: Simpan hasil dua aplikasi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-dua-aplikasi
          path: bukti/dua-aplikasi/junit.xml

  retur-dua-aplikasi:
    name: Integrasi HTTP retur PadiFlow dan TeraFlow terpin
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: uji
          POSTGRES_DB: uji_tf_retur_ci
        ports: ["56639:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      UJI_PG_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:56639/uji_tf_retur_ci
      DATABASE_URL: postgresql+asyncpg://postgres:uji@127.0.0.1:56639/uji_tf_retur_ci
      UJI_TF_ROOT: ${{ github.workspace }}/timbangan
      UJI_RETUR_OUT: ${{ github.workspace }}/bukti/retur-dua-aplikasi
    steps:
      - uses: actions/checkout@v4
        with:
          path: padiflow
      # Pin paket retur yang diuji; source82 tanpa perubahan retur tidak
      # membuktikan kontrak detail baru. Job pengiriman di atas tetap memakai82.
      - uses: actions/checkout@v4
        with:
          repository: hadimulyautama/timbangan
          ref: 3fd6d838aed67da916dc99bdd7a29397ac262468
          path: timbangan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            padiflow/requirements*.txt
            timbangan/requirements.txt
      - name: Periksa seluruh source paket retur terpin
        run: |
          python - <<'PYTHON'
          import hashlib,json
          from pathlib import Path
          root=Path('timbangan')
          manifest=json.loads((root/'CI_RETUR_SOURCE_MANIFEST.json').read_text())
          assert manifest['profile']=='retur-ci'
          assert manifest['release_version']=='83'
          assert manifest['base_commit']=='0200668a8eab721f4d991ede6e0808d4d656c411'
          assert len(manifest['delta_manifest'])==7
          assert len(manifest['source_manifest'])==172
          for file,digest in manifest['source_manifest'].items():
              assert hashlib.sha256((root/file).read_bytes()).hexdigest()==digest,file
          print('172 hash source paket retur cocok, termasuk tujuh delta teruji.')
          PYTHON
      - name: Pasang dua interpreter terpisah untuk retur
        run: |
          python -m pip install -r padiflow/requirements.txt -r padiflow/requirements-dev.txt
          python -m venv timbangan/.venv
          timbangan/.venv/bin/pip install -r timbangan/requirements.txt
      - name: Migrasi nyata dan integrasi HTTP retur
        working-directory: padiflow
        run: >-
          python -m pytest -q -m dua_aplikasi tests/pg/test_retur_dua_app.py
          --junitxml=../bukti/retur-dua-aplikasi/junit.xml
      - name: Simpan bukti integrasi retur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-retur-dua-aplikasi
          path: bukti/retur-dua-aplikasi/
