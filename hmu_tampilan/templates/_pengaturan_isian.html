<script type="application/json" id="pengaturan-isian">{{ {'aksi':isian_aksi|default(''),'isian':isian_alat|default({})}|tojson }}</script>
<script>(function(){const data=JSON.parse(document.getElementById('pengaturan-isian').textContent);if(!data.aksi)return;document.querySelectorAll('form[data-jaga-isian]').forEach(form=>{if(form.getAttribute('action')!==data.aksi)return;const key=data.isian.silo_id?'silo_id':data.isian.gudang_id?'gudang_id':null;const id=key&&form.elements.namedItem(key);if(key&&(!id||id.value!==(data.isian[key]||[])[0]))return;Object.entries(data.isian).forEach(([name,values])=>{if(name==='_csrf')return;Array.from(form.elements).filter(el=>el.name===name).forEach(el=>{if(el.type==='checkbox')el.checked=values.includes(el.value);else el.value=values[0]||''})});const details=form.closest('details');if(details)details.open=true})})();</script>
