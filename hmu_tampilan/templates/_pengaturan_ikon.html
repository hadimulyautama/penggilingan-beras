{% elif nama == 'history' %}<path d="M3 12a9 9 0 1 0 3-7M3 3v6h6m3-2v5l4 2"/>
{% elif nama == 'flask' %}<path d="M9 2h6m-5 0v7L3 21h18L14 9V2M6 16h12"/>
