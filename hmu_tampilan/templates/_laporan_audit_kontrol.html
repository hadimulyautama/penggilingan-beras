<div class="lk-audit-kontrol">
  <form class="kontrol-pencarian" method="get" action="/audit" role="search">
    <button class="kontrol-filter filter-berikon" type="button" data-lk-buka="lk-filter" aria-haspopup="dialog">Filter</button>
    <input type="hidden" name="rentang" value="{{ rentang }}"><input type="hidden" name="kelompok" value="{{ kelompok }}">
    <div class="kontrol-pencarian__form"><input class="kontrol-pencarian__input" type="search" name="cari" value="{{ cari }}" autocomplete="off" aria-label="Cari catatan audit" placeholder="Cari kode, pemasok, atau isi catatan…"><button class="kontrol-pencarian__submit cari-berikon" type="submit">Cari</button></div>
  </form>
  <p class="lk-cakupan">{% for k,n,_ in RENTANG %}{% if k==rentang %}{{ n }}{% endif %}{% endfor %} · {% for k,n,_ in KELOMPOK %}{% if k==kelompok %}{{ n }}{% endif %}{% endfor %}</p>
  <dialog class="lk-panel" id="lk-filter" aria-labelledby="lk-filter-judul"><header class="lk-panel-kepala"><h2 id="lk-filter-judul">Filter audit</h2><button class="btn lk-ikon" type="button" data-lk-tutup aria-label="Tutup filter">×</button></header>
    <form class="lk-form-filter" method="get" action="/audit"><input type="hidden" name="cari" value="{{ cari }}">
      <label>Rentang waktu<select class="fld" name="rentang">{% for k,n,_ in RENTANG %}<option value="{{ k }}"{% if k==rentang %} selected{% endif %}>{{ n }}</option>{% endfor %}</select></label>
      <label>Kelompok aktivitas<select class="fld" name="kelompok">{% for k,n,_ in KELOMPOK %}<option value="{{ k }}"{% if k==kelompok %} selected{% endif %}>{{ n }}</option>{% endfor %}</select></label>
      <button class="filter-berikon btn btn--utama" type="submit">Terapkan filter</button><a class="btn" data-lk-reset href="/audit?{{ {'rentang':'48j','kelompok':'semua','cari':cari}|urlencode }}">Reset filter</a>
    </form>
  </dialog>
</div>
