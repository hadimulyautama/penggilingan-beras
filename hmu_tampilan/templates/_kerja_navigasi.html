{% macro filter_gudang(href, kini) -%}
<nav class="saring kerja-gudang" aria-label="Gudang">
{% for k,n in [('', 'Semua gudang'),('g1','Gudang 1'),('g2','Gudang 2')] %}
<a class="pil{{ ' pil--on' if kini==k }}" href="{{ href(gudang=k) }}"{% if kini==k %} aria-current="true"{% endif %}>{{ n }}</a>
{% endfor %}
</nav>
{%- endmacro %}

{% macro kaki(buka, nilai) -%}
<script src="/static/aksi.js?v={{ VERSI }}" defer data-buka="{{ buka }}" data-nilai="{{ nilai }}"></script>
{%- endmacro %}
