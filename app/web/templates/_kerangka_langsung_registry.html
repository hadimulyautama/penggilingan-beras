{# Di luar bingkai; render frame tidak memasang host ini secara rekursif. #}
<script type="application/json" id="padi-kerangka-langsung" data-konteks="{{ registry.konteks }}" data-cap="{{ registry.cap }}">{{ registry|tojson }}</script>{% if stok %}
<script type="application/json" id="padi-stok-kerangka" data-konteks="{{ stok.konteks }}" data-cap="{{ stok.cap }}">{{ stok|tojson }}</script>{% endif %}{% if riwayat %}
<script type="application/json" id="padi-riwayat-kerangka" data-konteks="{{ riwayat.konteks }}" data-cap="{{ riwayat.cap }}">{{ riwayat|tojson }}</script>{% endif %}
{% if beranda %}<script type="application/json" id="padi-beranda-kerangka" data-konteks="{{ beranda.konteks }}" data-cap="{{ beranda.cap }}">{{ beranda|tojson }}</script>{% endif %}
{% if qc %}<script type="application/json" id="padi-qc-kerangka" data-konteks="{{ qc.konteks }}" data-cap="{{ qc.cap }}">{{ qc|tojson }}</script>{% endif %}
{% if kabar %}<script type="application/json" id="padi-kabar-kerangka" data-konteks="{{ kabar.konteks }}" data-cap="{{ kabar.cap }}">{{ kabar|tojson }}</script>{% endif %}

{% if laporan %}<script type="application/json" id="padi-laporan-kerangka" data-konteks="{{ laporan.konteks }}" data-cap="{{ laporan.cap }}">{{ laporan|tojson }}</script>{% endif %}
