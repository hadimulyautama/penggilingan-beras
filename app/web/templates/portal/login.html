<!doctype html>
<html lang="id" class="portal-document"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Masuk · PadiFlow Pelanggan</title>
{% include 'portal/_pwa.html' %}
<link rel="stylesheet" href="/static/app.css?v={{ VERSI }}"><link rel="stylesheet" href="/static/komponen-portal.css?v={{ VERSI }}"><link rel="stylesheet" href="/static/padiflow-brand.css?v={{ VERSI }}"><link rel="stylesheet" href="/static/portal-pelanggan.css?v={{ VERSI }}-scroll1">
<script src="/static/portal-pelanggan.js?v={{ VERSI }}" defer></script></head>
<body class="padiflow-ui portal-login {{ 'terik' if light }}"><main class="login-card">
<div class="login-brand"><img class="logo-light" src="/static/padiflow-logo-terang.png" alt="PadiFlow"><img class="logo-dark laci__logo--gelap" src="/static/padiflow-logo-gelap.png" alt="PadiFlow"><button type="button" class="btn" data-theme-toggle aria-label="{{ 'Aktifkan mode gelap' if light else 'Aktifkan mode terang' }}">{{ '☾' if light else '☀' }}</button></div>
<h1>Portal pelanggan</h1><p>Masuk untuk melihat barang dan pekerjaan milik Anda.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/pelanggan/masuk"><input type="hidden" name="_csrf" value="{{ csrf }}"><label>Nama pengguna<input name="username" autocomplete="username" maxlength="80" required></label><label>Kata sandi<input type="password" name="sandi" autocomplete="current-password" required></label><button class="tbl" type="submit">Masuk</button></form>
{% include 'portal/_pasang.html' %}</main></body></html>
