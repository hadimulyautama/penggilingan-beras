{% if not PORTAL_STOCK_DETAIL %}
<section aria-label="Rincian stok">
<a class="pelanggan-tautan" href="/pelanggan/barang-saya">← Kembali ke Barang saya</a>
<h1>{{ {'bahan':'Beras pecah kulit (PK)','produk':'Beras dan hasil samping','karung':'Karung kosong'}.get(STOK_NAV.jenis,'Stok barang') }}</h1>
{% if STOK_NAV.lokasi_pil %}<form method="get" action="/pelanggan/stok" class="pelanggan-filter-lokasi"><input type="hidden" name="tab" value="{{ STOK_NAV.jenis }}"><label>Lokasi<select name="gudang">{% for g in STOK_NAV.lokasi_pil %}<option value="{{ g.kunci }}"{% if g.kunci==STOK_NAV.gudang %} selected{% endif %}>{{ g.nama }}</option>{% endfor %}</select></label><button type="submit" class="btn">Tampilkan</button></form>{% endif %}
</section>
{% endif %}
