<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block judul %}Penggilingan Beras{% endblock %}</title>
<style>
:root{
  --bg:#f3f4f2; --kartu:#fff; --tx:#14181a; --mut:#5d6a6d;
  --bd:#d6dbd8; --ac:#1f5f7d; --acx:#fff; --err:#a3372b; --ok:#2f6a45;
  --sentuh:52px;              /* target sentuh minimum — dipakai sambil berdiri */
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#10161a; --kartu:#182025; --tx:#e6ecea; --mut:#9aa8ab;
         --bd:#2a353a; --ac:#6fb1d1; --acx:#0d1417; --err:#e08476; --ok:#7cc196; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
.bar{display:flex;align-items:center;gap:12px;justify-content:space-between;
  background:var(--kartu);border-bottom:1px solid var(--bd);padding:10px 14px;
  position:sticky;top:0;z-index:5}
.siapa{min-width:0}
/* Nama dicetak besar dengan sengaja: di perangkat gudang yang dipakai
   bergantian, orang harus melihat "ini akun siapa" tanpa mencarinya. */
.siapa b{display:block;font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.siapa span{font-size:12.5px;color:var(--mut)}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 40px}
.kartu{background:var(--kartu);border:1px solid var(--bd);border-radius:12px;padding:18px 16px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px} h2{font-size:17px;margin:0 0 10px}
p{margin:0 0 12px} .mut{color:var(--mut);font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;min-height:var(--sentuh);padding:10px 12px;font-size:16px;
  border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx)}
button{min-height:var(--sentuh);padding:12px 16px;font-size:16px;font-weight:600;
  border:1px solid var(--ac);border-radius:9px;background:var(--ac);color:var(--acx);cursor:pointer;width:100%}
button.samar{background:transparent;color:var(--ac)}
button.kecil{width:auto;min-height:40px;padding:8px 12px;font-size:14px;font-weight:500}
form.sebaris{display:inline}
.pesan{border-radius:9px;padding:11px 13px;margin-bottom:14px;font-size:14.5px;border:1px solid}
.pesan.err{color:var(--err);border-color:var(--err);background:transparent}
.pesan.ok{color:var(--ok);border-color:var(--ok);background:transparent}
.baris{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid var(--bd)}
.baris:last-child{border-bottom:none}
.aksi{display:flex;flex-wrap:wrap;gap:6px}
.tandai{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;
  border:1px solid var(--bd);color:var(--mut)}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
{% if akun %}
<div class="bar">
  <div class="siapa">
    <b>{{ akun.nama }}</b>
    <span>{{ akun.peran }}{% if akun.sesi_pendek %} · perangkat gudang{% endif %}</span>
  </div>
  <form method="post" action="/keluar">
    <button class="samar kecil" type="submit">
      {% if akun.sesi_pendek %}Ganti pengguna{% else %}Keluar{% endif %}
    </button>
  </form>
</div>
{% endif %}
<div class="wrap">
{% block isi %}{% endblock %}
</div>
</body>
</html>
