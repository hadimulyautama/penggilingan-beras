<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block judul %}Pos Produksi{% endblock %} · PT Hadi Mulya Utama</title>
<meta name="theme-color" content="#16212a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pos Produksi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="bingkai">

{% if akun %}
<header class="bar">
  {% if kembali %}
    <a class="bar__balik" href="{{ kembali }}" aria-label="Kembali">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
  {% else %}
    <div class="bar__avatar">{{ akun.nama[:2]|upper }}</div>
  {% endif %}
  <div class="bar__isi">
    <div class="bar__nama">{{ akun.nama }}</div>
    <div class="bar__sub">
      {{ akun.peran }}{% if akun.sesi_pendek %} · perangkat gudang{% endif %}
    </div>
  </div>
  <form method="post" action="/keluar">
    <button class="btn btn--kecil" type="submit">
      {% if akun.sesi_pendek %}Ganti{% else %}Keluar{% endif %}
    </button>
  </form>
</header>
{% endif %}

<main class="isi">
{% block isi %}{% endblock %}
</main>

{% block kaki %}{% endblock %}
</div>

<script>
/* "lihat" pada kotak sandi. Mengetik sandi di gudang, sambil berdiri, dengan
   layar yang mungkin kena matahari — tanpa cara memeriksa apa yang terketik,
   orang menyerah setelah dua kali salah dan memanggil Direksi. */
document.querySelectorAll("[data-lihat]").forEach(function (tbl) {
  tbl.addEventListener("click", function () {
    var kotak = document.getElementById(tbl.dataset.lihat);
    if (!kotak) return;
    var tampil = kotak.type === "password";
    kotak.type = tampil ? "text" : "password";
    tbl.textContent = tampil ? "sembunyi" : "lihat";
    tbl.setAttribute("aria-label", tampil ? "Sembunyikan kata sandi" : "Tampilkan kata sandi");
    kotak.focus();
  });
});
</script>
</body>
</html>
