{% macro header(label, title, description, stats) %}
<style>@import url('/static/riwayat.css?v={{ VERSI }}');</style>
<section class="riwayat-intro" aria-label="{{ title }}">
  <header class="riwayat-hero">
    <div class="riwayat-eyebrow"><i></i>{{ label }}</div>
    <h1>{{ title }}</h1>
    <p>{{ description }}</p>
  </header>
  <div class="riwayat-stats" aria-label="Ringkasan {{ title }}">
    {% for icon, value, caption in stats %}
    <article class="riwayat-stat">
      <span class="riwayat-stat__icon riwayat-stat__icon--{{ loop.index }}">{{ icon }}</span>
      <div><strong>{{ value }}</strong><span>{{ caption }}</span></div>
    </article>
    {% endfor %}
  </div>
</section>
{% endmacro %}
